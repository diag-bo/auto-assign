# Writes the app's settings to every Vercel account from the GitHub secrets of this
# repo (the one copy that doesn't move when the accounts do) and rebuilds them.
# Add or change a setting in GitHub, then run this. Logic:
# .github/scripts/vercel-env-sync.mjs.
name: Vercel env sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: true
      redeploy:
        description: Rebuild every serving account afterwards
        type: boolean
        default: true

permissions:
  contents: read

concurrency: vercel-domain

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/vercel-env-sync.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REDEPLOY: ${{ inputs.redeploy }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VERCEL_TOKEN_A: ${{ secrets.VERCEL_TOKEN_A }}
          VERCEL_TOKEN_B: ${{ secrets.VERCEL_TOKEN_B }}
          VERCEL_TOKEN_C: ${{ secrets.VERCEL_TOKEN_C }}
          VERCEL_TOKEN_D: ${{ secrets.VERCEL_TOKEN_D }}
